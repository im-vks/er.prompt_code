<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterglow</title>
<style>
:root{--bg:#06030f;--ink:#f4eaff;--dim:rgba(244,234,255,.62);--cy:#29f0ff;--mg:#ff2bd6;--am:#ffc14d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Avenir Next",Futura,"Trebuchet MS",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.6)),repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none;opacity:0;transition:opacity 1s;font-size:13px;letter-spacing:.04em}
.hud.on{opacity:1}
.hud b{display:block;font-size:34px;font-weight:300;letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums}
.hud small{color:var(--dim);font-size:12px}
.mid{text-align:center}
.pips{display:flex;gap:5px;justify-content:center;margin-top:8px}
.pips i{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);transition:background .3s,box-shadow .3s}
.pips i.on{background:var(--cy);box-shadow:0 0 8px var(--cy)}
.rt{justify-self:end;display:flex;gap:8px}.rt button{white-space:nowrap}.nit{width:90px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);margin:7px auto 0;overflow:hidden}.nit i{display:block;height:100%;width:0;background:var(--am);box-shadow:0 0 8px var(--am)}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chips button.on{background:rgba(41,240,255,.18);border-color:var(--cy)}.chips button:disabled{opacity:.4}#intro small{color:var(--dim);font-size:12px;max-width:34ch}#snd,#mnu,.chips button{pointer-events:auto;background:none;border:1px solid rgba(255,255,255,.25);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;color:var(--dim);font-size:14px;opacity:0;transition:opacity 1.5s;pointer-events:none}
.hint.on{opacity:1}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;touch-action:pan-y;gap:12px;padding:18px;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(6,3,15,.2),rgba(6,3,15,.85));transition:opacity .9s}
#intro.off{opacity:0;pointer-events:none}
h1{margin:0;font-size:clamp(44px,15vw,104px);font-weight:900;font-style:italic;line-height:1.05;padding:0 .1em;background:linear-gradient(180deg,#d6fbff 0 46%,#ffc14d 46% 54%,#ff2bd6 54% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,43,214,.55))}
#intro p{margin:0;color:var(--dim);max-width:30ch;line-height:1.5;font-size:15px}
#go,#gbtn{margin-top:6px;font:inherit;font-size:16px;font-weight:600;color:#06030f;background:linear-gradient(90deg,var(--cy),var(--mg));border:0;border-radius:30px;padding:14px 34px;box-shadow:0 0 28px rgba(41,240,255,.45)}
.panel{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px}
.panel[hidden]{display:none}
.lbl{align-self:flex-start;color:var(--dim);font-size:13px;margin-top:2px}
.glass,.card,.seg,.tile,.srow,.gcar{background:rgba(14,7,30,.62);border:1px solid rgba(255,255,255,.15);border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.card{font:inherit;color:var(--ink);text-align:left;padding:0 0 10px;overflow:hidden;transition:transform .15s,border-color .2s,box-shadow .2s}
.card i{display:block;height:30px;margin-bottom:8px;opacity:.9}
.card b{display:block;font-size:14px;padding:0 10px}
.card small{display:block;padding:0 10px;margin-top:2px;font-size:11px}
.card.on,.gcar.on{border-color:var(--cy);box-shadow:0 0 18px rgba(41,240,255,.35)}
.card.on{transform:translateY(-2px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;padding:3px;box-sizing:border-box}
.seg button{font:inherit;font-size:14px;color:var(--dim);background:none;border:0;border-radius:11px;padding:10px 0}
.seg button.on{color:#06030f;font-weight:600;background:linear-gradient(90deg,var(--cy),var(--mg))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tile{font:inherit;color:var(--ink);padding:14px;display:flex;justify-content:space-between;align-items:center}
.tile span+span{color:var(--am)}
.ghost{font:inherit;font-size:14px;color:var(--dim);background:none;border:0;padding:6px 10px}
.ghead{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:17px}
.ghead span{color:var(--am);min-width:60px;text-align:right}
#gcv{width:100%;height:190px;border-radius:16px;background:rgba(14,7,30,.55);border:1px solid rgba(255,255,255,.14)}
.gname{text-align:center}.gname b{display:block;font-size:22px;font-weight:600}
.gcars{display:flex;gap:10px;overflow-x:auto;width:100%;padding:4px 2px;touch-action:pan-x}
.gcar{flex:0 0 auto;min-width:92px;font:inherit;color:var(--ink);text-align:left;padding:10px}
.gcar b{display:block;font-size:14px}.gcar small{font-size:12px;color:var(--am)}
#gbtn:disabled{opacity:.45;box-shadow:none}
.dots{display:flex;gap:12px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.dot.on{border-color:#fff;box-shadow:0 0 10px #fff}
.srow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;box-sizing:border-box;text-align:left}
.srow small{display:block;margin-top:2px}
.sw{width:48px;height:28px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);position:relative;padding:0;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--cy)}.sw.on::after{transform:translateX(20px)}
.hud .sh{display:block;margin-top:4px;color:var(--am)}
@media (prefers-reduced-motion:reduce){#intro,.hud,.hint{transition:none}.card,.sw::after{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="fx"></div>
<div class="hud" id="hud">
  <div><b id="chord">F</b><small id="bpm">ambient</small><small class="sh" id="sh">◆ 0</small></div>
  <div class="mid"><b id="streak">0</b><small>streak</small><div class="pips" id="pips"><i></i><i></i><i></i><i></i></div><div class="nit"><i id="nf"></i></div></div>
  <div class="rt"><button id="snd">sound on</button><button id="mnu">menu</button></div>
</div>
<div class="hint" id="hint">Hold to drive, tap a lane to steer, double-tap for nitro.</div>
<div id="intro">
 <div class="panel" id="home">
  <h1>Afterglow</h1><p id="tag"></p>
  <button id="go">Start driving</button><button class="ghost" id="rs" hidden>Restart run</button>
  <div class="lbl">Soundtrack</div><div class="cards" id="mk"></div>
  <div class="lbl">Route</div><div class="seg" id="rtc"></div>
  <div class="row2"><button class="tile" id="gar"><span>Garage</span><span id="shc">◆ 0</span></button><button class="tile" id="set"><span>Settings</span><span>›</span></button></div>
  <small id="lb"></small>
 </div>
 <div class="panel" id="gpanel" hidden>
  <div class="ghead"><button class="ghost" id="gback">Back</button><b>Garage</b><span id="gsh">◆ 0</span></div>
  <canvas id="gcv"></canvas>
  <div class="gname"><b id="gn"></b><small id="gperk"></small></div>
  <div class="gcars" id="gl"></div>
  <button id="gbtn">Equip</button>
  <div class="lbl">Underglow</div><div class="dots" id="gg"></div>
 </div>
 <div class="panel" id="spanel" hidden>
  <div class="ghead"><button class="ghost" id="sback">Back</button><b>Settings</b><span></span></div>
  <div class="srow"><span>Tilt steering<small>Lean your phone to switch lanes</small></span><button class="sw" id="swt"></button></div>
  <div class="srow"><span>Sound<small>Music and effects</small></span><button class="sw" id="sws"></button></div>
  <div class="srow"><span>Reset progress<small>Clears shards, cars and scores</small></span><button class="ghost" id="rst">Reset</button></div>
 </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('c');let ctx=cv.getContext('2d');
const ZMAX=42,ROAD=1.55,TAU=Math.PI*2;
const LC=[[41,240,255],[255,43,214],[255,193,77]];
const PAL=[
{top:[22,8,58],mid:[96,24,120],hor:[255,92,140],s0:[255,214,110],s1:[255,52,130],grid:[255,43,214],gl:[41,240,255],st:.25},
{top:[2,3,14],mid:[9,14,58],hor:[28,52,150],s0:[200,236,255],s1:[90,150,255],grid:[41,240,255],gl:[255,43,214],st:1},
{top:[24,16,72],mid:[140,58,128],hor:[255,170,100],s0:[255,244,170],s1:[255,130,76],grid:[255,122,224],gl:[255,214,110],st:.45}];
const lerp=(a,b,t)=>a+(b-a)*t,mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function pal(t){const i=((Math.floor(t)%3)+3)%3,f=t-Math.floor(t),u=f<.4?0:Math.min(1,(f-.4)/.6),e=u*u*(3-2*u),A=PAL[i],B=PAL[(i+1)%3],o={};for(const k in A)o[k]=k==='st'?lerp(A[k],B[k],e):mix(A[k],B[k],e);return o}
let W,H,hy,S;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);hy=H*.44;S=Math.min(W*.48,(H-hy)*.8)/ROAD}
addEventListener('resize',resize);resize();
/* state */
let s=0,n=0,curMax=7,tod=0,T=0,carX=0,tgt=0,camX=0,bend=0,streak=0,e=2,started=false,down=false,keyGas=false,gasUntil=0,flash=0,flashC=LC[1],chord=1,stepDone=0,nextGate=16.3,prevX=9,lastIdx=2,muted=false;
let gates=[],parts=[],cars=[],ci=0,mi=0,daily=true,tilt=false,ambient=false,paused=false,nitro=0,charge=0,lastTap=0,rain=0,fog=0,storm=0,tunAmt=0,seed=1,rG,rT,lightT=3,nextCar=30,store={};
let shield=0,gemN=0,gsel=0,garage=false,meteors=[],pops=[],gems=[],nextGem=14,rS;
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296};
const hh=i=>((Math.sin(i*12.9898+seed*78.233)*43758.5453)%1+1)%1,today=()=>new Date().toISOString().slice(0,10);
try{store=JSON.parse(localStorage.getItem('ag')||'{}')}catch(_){}
const save=()=>{try{localStorage.setItem('ag',JSON.stringify(store))}catch(_){}};
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.4,p:Math.random()*6}));
const px=(x,z)=>W/2+(x-camX)*S/z+bend*W*.18*(1-1/z),py=z=>hy+(H-hy)/z;
/* audio */
let fbN,vgN,rainG,AC=null,master,delay,verb,noiseBuf,padFilter,padGain,padVoices=[];
const PADBASE=.42,mf=m=>440*Math.pow(2,(m-69)/12);
const MODES=[
{n:'Synthwave',lead:[69,72,74,76,79,81,84],arp:'square',bass:'sawtooth',kd:4,cut:1,ch:[{n:'Am',pad:[57,60,64],root:45,arp:[69,72,76]},{n:'F',pad:[53,57,60],root:41,arp:[65,69,72]},{n:'G',pad:[55,59,62],root:43,arp:[67,71,74]}]},
{n:'Lo-fi',lead:[69,72,74,76,79,81,84],arp:'triangle',bass:'sine',kd:8,cut:.6,ch:[{n:'Dm7',pad:[50,57,60],root:38,arp:[62,65,69]},{n:'G7',pad:[55,59,65],root:43,arp:[67,71,74]},{n:'Cmaj7',pad:[52,59,60],root:48,arp:[64,67,71]}]},
{n:'Sunrise',lead:[74,76,78,81,83,86,88],arp:'triangle',bass:'sawtooth',kd:4,cut:1.3,ch:[{n:'D',pad:[50,54,57],root:38,arp:[62,66,69]},{n:'A',pad:[52,57,61],root:45,arp:[64,69,73]},{n:'Bm',pad:[50,54,59],root:47,arp:[66,71,74]}]}];
const CARS=[{n:'Neon',p:0,body:'#10061c',tl:[255,74,120],glow:null,perk:'',pk:'Balanced and bright'},
{n:'Chrome',p:40,body:'#2a2540',tl:[255,255,255],glow:[200,230,255],perk:'nitro',pk:'Nitro charges 50% faster'},
{n:'Sunset',p:90,body:'#2a0a1a',tl:[255,193,77],glow:[255,140,60],perk:'wide',pk:'Wider gates, more forgiving'},
{n:'Ghost',p:160,body:'#05202a',tl:[41,255,200],glow:[41,255,200],perk:'shield',pk:'Shield absorbs one crash per run'},
{n:'Vapor',p:260,body:'#1b1033',tl:[255,160,255],glow:[150,120,255],perk:'x2',pk:'Double shards from everything'}];
const GLOWS=[null,[41,240,255],[255,43,214],[255,193,77],[255,255,255],[120,255,90]];
const TRAF={body:'#1a0a22',tl:[255,50,50],glow:null};
let M=MODES[0],CH=M.ch;
const ARP=[0,1,2,1,2,1,0,2];let LEAD=M.lead;
function initAudio(){
 const AX=window.AudioContext||window.webkitAudioContext;if(AC||!AX)return;
 AC=new AX();master=AC.createGain();master.gain.value=0;
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
 master.connect(comp);comp.connect(AC.destination);
 delay=AC.createDelay(1);delay.delayTime.value=.4;
 const fb=AC.createGain(),dl=AC.createBiquadFilter();fb.gain.value=.38;fbN=fb;dl.type='lowpass';dl.frequency.value=2400;
 delay.connect(dl);dl.connect(fb);fb.connect(delay);dl.connect(master);
 const len=AC.sampleRate*2.4,ir=AC.createBuffer(2,len,AC.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
 verb=AC.createConvolver();verb.buffer=ir;const vg=AC.createGain();vg.gain.value=.5;vgN=vg;verb.connect(vg);vg.connect(master);
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;rainG=AC.createGain();rainG.gain.value=0;{const rs=AC.createBufferSource(),rf=AC.createBiquadFilter();rs.buffer=noiseBuf;rs.loop=true;rf.type='bandpass';rf.frequency.value=3500;rs.connect(rf);rf.connect(rainG);rainG.connect(master);rs.start()}
 padFilter=AC.createBiquadFilter();padFilter.type='lowpass';padFilter.frequency.value=700;padFilter.Q.value=.7;
 padGain=AC.createGain();padGain.gain.value=0;padFilter.connect(padGain);padGain.connect(master);padGain.connect(verb);
 for(let v=0;v<3;v++){const pair=[];for(const det of[-7,7]){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.detune.value=det;o.frequency.value=mf(CH[chord].pad[v]);g.gain.value=.16;o.connect(g);g.connect(padFilter);o.start();pair.push(o)}padVoices.push(pair)}
 master.gain.setTargetAtTime(muted?0:.85,AC.currentTime,.8);padGain.gain.setTargetAtTime(PADBASE,AC.currentTime,1.5);
}
function setChord(i){chord=i;if(!AC)return;const t=AC.currentTime;CH[i].pad.forEach((m,j)=>padVoices[j].forEach(o=>o.frequency.setTargetAtTime(mf(m),t,.2)))}
function duck(t){padGain.gain.cancelScheduledValues(t);padGain.gain.setValueAtTime(PADBASE*.35,t);padGain.gain.linearRampToValueAtTime(PADBASE,t+.28)}
function blip(type,f,t,dur,vol,cut,dly,rev){
 const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 fl.type='lowpass';fl.frequency.setValueAtTime(cut,t);fl.frequency.exponentialRampToValueAtTime(Math.max(200,cut*.2),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(fl);fl.connect(g);g.connect(master);
 if(dly){const x=AC.createGain();x.gain.value=dly;g.connect(x);x.connect(delay)}
 if(rev){const x=AC.createGain();x.gain.value=rev;g.connect(x);x.connect(verb)}
 o.start(t);o.stop(t+dur+.05);
}
function noise(t,dur,vol,type,f,rev){
 const src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();src.buffer=noiseBuf;fl.type=type;fl.frequency.value=f;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(fl);fl.connect(g);g.connect(master);
 if(rev){const x=AC.createGain();x.gain.value=rev;g.connect(x);x.connect(verb)}
 src.start(t,Math.random()*.5);src.stop(t+dur+.02);
}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(master);o.start(t);o.stop(t+.35);duck(t)}
function step(k,v){
 const t=AC.currentTime+.02,q=k%16;
 if(q%4===0){if(chord!==tgt+1)setChord(tgt+1);delay.delayTime.setTargetAtTime(Math.min(.9,45/Math.max(50,v*15)),t,.2)}
 const c=CH[chord],vol=.35+.65*Math.min(1,v/5);
 if(e>=1&&!ambient){if(q%M.kd===0)kick(t);if(q===4||q===12)noise(t,.2,.3,'bandpass',1800,.35);if(q%2===1)noise(t,.04,.1,'highpass',7500,0)}
 if(q%2===0)blip(M.bass,mf(c.root+(q%8===6?12:0)),t,.24,.3,(450+v*60)*M.cut,0,0);
 if(e>=2)blip(M.arp,mf(c.arp[ARP[q%8]]+(q%8===7?12:0)),t,.2,.05*vol,2600,.35,.15);
 if(e>=3&&q%4===2)blip('triangle',mf(c.arp[(q>>2)%3]+24),t,.5,.07,5000,.5,.4);
 if(e>=4&&q%8===6)noise(t,.3,.12,'highpass',5000,.3);
}
function hitSound(i){const t=AC.currentTime+.005,m=LEAD[i];blip('triangle',mf(m),t,.7,.22,4200,.5,.45);blip('sine',mf(m+12),t,.5,.08,6000,.4,.4)}
function missSound(){const t=AC.currentTime+.005;noise(t,.3,.25,'lowpass',500,.2);blip('sawtooth',mf(36),t,.35,.2,300,0,0)}
/* input */
const lane=x=>Math.max(-1,Math.min(1,Math.floor(x/W*3)-1));
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();down=true;if(!tilt)tgt=lane(ev.clientX);{const tn=performance.now();if(tn-lastTap<320)fireNitro();lastTap=tn}try{cv.setPointerCapture(ev.pointerId)}catch(_){}});
cv.addEventListener('pointermove',ev=>{if(down&&!tilt)tgt=lane(ev.clientX)});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>down=false));
addEventListener('keydown',ev=>{const k=ev.key;
 if(k==='ArrowLeft'||k==='a'||k==='A'){tgt=Math.max(-1,tgt-1);gasUntil=T+1.6}
 else if(k==='ArrowRight'||k==='d'||k==='D'){tgt=Math.min(1,tgt+1);gasUntil=T+1.6}
 else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){keyGas=true;ev.preventDefault()}else if(k==='Shift'||k==='n'||k==='N')fireNitro();else if(k==='Escape'||k==='p'||k==='P')escMenu()});
addEventListener('keyup',ev=>{if(ev.key===' '||ev.key==='ArrowUp'||ev.key==='w'||ev.key==='W')keyGas=false});
$('snd').onclick=()=>{muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:.85,AC.currentTime,.1);$('snd').textContent=muted?'sound off':'sound on'};
$('go').onclick=()=>{try{initAudio();if(AC&&AC.state==='suspended')AC.resume()}catch(err){AC=null}if(!started){started=true;restart()}paused=false;gasUntil=T+2.5;
 $('intro').classList.add('off');$('hud').classList.add('on');$('hint').classList.add('on');setTimeout(()=>$('hint').classList.remove('on'),9000)};
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():started&&AC.resume()});
/* drawing */
function ridge(amp,seed,par,fill,edge){

  ctx.strokeStyle=rgb(c,a);ctx.lineWidth=Math.max(1,3.5/z);ctx.beginPath();ctx.moveTo(px(x,z),py(z));ctx.lineTo(px(x,z),py(z)-h/z);ctx.stroke();

/* extras */
const inTun=v=>{const g=Math.floor(v/90);return hh(g+5)>.74&&(v%90)>8&&(v%90)<66};
function drawCity(P){
 for(let side=-1;side<=1;side+=2)for(let i=(Math.floor(s/6)+ZMAX/6)|0;i>=Math.floor(s/6);i--){
  const sv=i*6+hh(i*2+side)*3,z=sv-s+1;if(z<.9||z>ZMAX)continue;
  const x=side*(3.2+hh(i+side*9)*4),w=1+hh(i*3)*1.6,h=2+hh(i*5+side)*6;
  const xa=px(x-w/2,z),xb=px(x+w/2,z),yb=py(z),hp=h*S/z,c=(i+side+2)%2?P.grid:P.gl;
  ctx.globalAlpha=Math.min(1,(ZMAX-z)/12);ctx.fillStyle='#0b0518';ctx.fillRect(xa,yb-hp,xb-xa,hp);
  ctx.fillStyle=rgb(c,.5);for(let j=1;j<5;j++)if(hh(i*7+j)>.4)ctx.fillRect(xa+(xb-xa)*.15,yb-hp*j/5,(xb-xa)*.7,Math.max(1,hp*.03));
  ctx.fillStyle=rgb(c,.9);ctx.fillRect(xa,yb-hp,xb-xa,Math.max(1.5,3/z));
 }
 ctx.globalAlpha=1;
}

/* hud */
const pips=[...document.querySelectorAll('#pips i')];let hs=-1,hb='',hc='',hk=-1,hsh='';
function hud(v){
 const st=ambient?'drift':streak;if(st!==hs){hs=st;$('streak').textContent=st}$('nf').style.width=(nitro>0?nitro/4:charge)*100+'%';const sh='◆ '+((store.shards||0)|0);if(sh!==hsh){hsh=sh;$('sh').textContent=sh}
 const b=v>1.2?Math.round(v*15)+' bpm':'ambient';if(b!==hb){hb=b;$('bpm').textContent=b}
 const cn=CH[chord].n;if(cn!==hc){hc=cn;$('chord').textContent=cn}

}
function burst(g){const z=1.3,x=px(g.x,z),y=py(z)-.5*S/z;for(let i=0;i<22;i++){const a=Math.random()*TAU,sp=60+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,l:1,c:LC[g.l]})}}
/* loop */
let last=performance.now();
function frame(now){
 const dt=paused?0:Math.max(0,Math.min(.05,(now-last)/1000));last=now;T+=dt;
 const gas=started&&(down||keyGas||T<gasUntil||nitro>0);
 if(ambient&&started)n+=(.45-n)*Math.min(1,dt*.8);else if(gas)n+=(1-n)*Math.min(1,dt*1.4);else n*=Math.exp(-dt*.45);
 if(n<.003)n=0;

 const v=n*curMax*(nitro>0?1.6:1);s+=(started?v:.7)*dt;
 tod+=dt*(.0025+n*.012);carX+=(tgt-carX)*Math.min(1,dt*12);camX=carX*.4;
 bend=Math.sin(s*.011)*.9+Math.sin(s*.0047+1.3)*.5;
 const u=hh(Math.floor(s/300)+11),wt=u<.4?[0,0,0]:u<.65?[.7,.15,0]:u<.85?[0,.6,0]:[1,.3,1];
 rain+=(wt[0]-rain)*dt*.3;fog+=(wt[1]-fog)*dt*.3;storm+=(wt[2]-storm)*dt*.3;tunAmt+=((inTun(s+.5)?1:0)-tunAmt)*Math.min(1,dt*3);
 if(storm>.5&&started&&(lightT-=dt)<0){lightT=3+Math.random()*6;flash=.9;flashC=[220,230,255];if(AC)noise(AC.currentTime+.3,1.4,.5,'lowpass',220,.5)}
 while(!ambient&&nextGem<s+ZMAX){const gx=((rS()*3)|0)-1,cnt=3+((rS()*3)|0);for(let i=0;i<cnt;i++)gems.push({s:nextGem+i*1.5,x:gx});nextGem+=24+rS()*16}
 while(!ambient&&nextCar<s+ZMAX){cars.push({s:nextCar,x:((rT()*3)|0)-1,t:(rT()*3)|0});nextCar+=11+rT()*9}
 while(nextGate<s+ZMAX){let x;do{x=((rG()*3)|0)-1}while(x===prevX&&rG()<.6);prevX=x;lastIdx=Math.max(0,Math.min(6,lastIdx+((rG()*5)|0)-2));gates.push({s:nextGate,x,l:x+1,idx:lastIdx,st:0});nextGate+=8}
 if(started)for(const g of gates)if(g.st===0&&g.s-s<=.3){
  if(Math.abs(carX-g.x)<(CARS[ci].perk==='wide'?.78:.62)){g.st=1;streak++;charge=Math.min(1,charge+(CARS[ci].perk==='nitro'?.15:.1));e=Math.min(4,e+.5);flash=.5;flashC=LC[g.l];burst(g);if(AC)hitSound(g.idx);const pf=Math.abs(carX-g.x)<.2;earn(pf?2:1);popup(pf?'PERFECT +'+2*mult():'+'+mult(),px(g.x,1.3),py(1.3)-1.4*S/1.3,pf?[255,230,120]:LC[g.l]);if(MILE.includes(streak))milestone()}
  else{g.st=2;if(!ambient){endRun();e=Math.max(.5,e-1);flash=.5;flashC=[255,40,70];if(AC)missSound()}}
 }
 gates=gates.filter(g=>g.s-s>-2.5);
 if(started)for(const c of cars){c.s+=2.5*dt;if(!c.d&&Math.abs(c.s-s-.3)<.45&&Math.abs(c.x-carX)<.55){c.d=1;if(nitro>0){streak++;earn(3);popup('SMASH +'+3*mult(),px(c.x,1.3),py(1.3)-S,[41,240,255]);burst({x:c.x,l:c.t});flash=.4;flashC=LC[c.t]}else if(!ambient){if(shield){shield=0;popup('Shield used',W/2,H*.35,[170,255,235],1);flash=.5;flashC=[170,255,235];if(AC)hitSound(3)}else{endRun();e=Math.max(.5,e-1);n*=.35;flash=.7;flashC=[255,40,70];if(AC)missSound()}}}}
 cars=cars.filter(c=>!c.d&&c.s-s>-2.5);if(ambient)e=3;
 if(started)for(const q of gems)if(!q.d&&Math.abs(q.s-s-.3)<.45&&Math.abs(q.x-carX)<.6){q.d=1;earn(1);popup('+'+mult(),px(q.x,1.3),py(1.3)-S,[255,230,120]);if(AC)blip('sine',mf(88+((gemN++)%5)*2),AC.currentTime+.01,.25,.12,6000,.3,.3)}
 gems=gems.filter(q=>!q.d&&q.s-s>-2.5);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.l-=dt*1.6}parts=parts.filter(p=>p.l>0);for(const p of pops){p.y-=(p.big?20:45)*dt;p.l-=dt*(p.big?.6:1.1)}pops=pops.filter(p=>p.l>0);
 const k=Math.floor(s);
 if(started&&AC){let c=0;while(stepDone<k&&c++<4){stepDone++;step(stepDone,v)}if(stepDone<k)stepDone=k;
  if(n<.15&&chord!==tgt+1)setChord(tgt+1);
  padFilter.frequency.setTargetAtTime((500+n*1300+e*300)*M.cut,AC.currentTime,.4);const t0=AC.currentTime;fbN.gain.setTargetAtTime(.38+.25*tunAmt,t0,.3);vgN.gain.setTargetAtTime(.5+.6*tunAmt,t0,.3);rainG.gain.setTargetAtTime(rain*.1,t0,.5)}else stepDone=k;
 draw(pal(tod),v,dt);hud(v);if(garage)drawShowroom();
 requestAnimationFrame(frame);
}
store.best=store.best||0;if(store.mode!=null)setMode(store.mode);store.owned=store.owned||[0];store.shards=store.shards||0;ci=store.car||0;if(!store.owned.includes(ci))ci=0;gsel=ci;newSeed();menu();
requestAnimationFrame(frame);
})();
